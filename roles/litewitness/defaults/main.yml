---
# The name of the witness.  Use a schema-less URL for a domain name that you
# control.  This helps avoid accidental naming collisions for witnesses.  The
# URL does not need to be network reachable.
#
# ---Example
# litewitness_name: example.org/witness
litewitness_name: ""

# Keyhash of the public Ed25519 witness key (hint: sigsum-key to-hash -k
# /path/to/pubkey).  This is used as a handle when accessing the private key
# via the SSH agent protocol (using sigsum-agent).
#
# ---Example
# litewitness_keygrip: 70ef4421b0ff38436855c2650988da6b03309d2105d6280fbb30dd1e635954ae
litewitness_keygrip: ""

# Address to listen for witness requests.
# Note: you need to sort out HTTPS reverse proxying outside of this role.
litewitness_listen_endpoint: "127.0.0.1:6000"

# Address to listen for metrics requests, instead of exposing them on the main
# listener.
litewitness_listen_metrics: "127.0.0.1:5999"

# Toggle / and /logz endpoints
litewitness_debug_endpoints_enabled: false


# Define which logs to be witnessed.  It is required to supply `vkey`, `qpd`,
# and `contact` per the log-list format.  It is optional to supply `origin`.
# The default value for `origin` is the `vkey` key name (strongly recommended).
#
# Read more:
# https://witness-network.org/log-list-format/
#
# ---Example
# litewitness_logs:
#   - vkey: "sum.golang.org+033de0ae+Ac4zctda0e5eza+HJyk9SxEdh+s3Ux18htTTAD8OuAn8"
#     origin: "go.sum database tree"
#     qpd: 86400
#     contact: sysadmin@example.org
#
# Warning: removing/updating a log here *does not* result in an updated
# configuration.  For updates and removal you need to tinker manually.
litewitness_logs: []

# Optionally discover logs to witness from a centrally managed list.  The
# expected list format is defined by <https://witness-network.org/>.  A
# systemd timer pulls these lists every 15 minutes (no-op when empty).
#
# ---Example
# litewitness_pull_logs:
#   - https://testing.witness-network.org/log-list.1
litewitness_pull_logs: []
