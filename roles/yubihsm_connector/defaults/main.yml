---
# Log level.
yubihsm_connector_log_level: warn

# For each yubihsm-connector specify three things:
# name (arbitrary), serial_number, and port.
# Example:
# yubihsm_connector_instances:
#   - name: 111
#     serial_number: 11111111
#     port: 12345
#   - name: 222
#     serial_number: 22222222
#     port: 12346
yubihsm_connector_instances: []

# Debian options.  Note that backports will be configured if the target system
# runs Debian bookworm.  Earlier Debian distributions are not supported.
yubihsm_connector_debian_deb_source: https://deb.debian.org/debian
