---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: bookworm
    image: docker.io/library/debian:bookworm
    dockerfile: ../Containerfile.Debian.j2
    privileged: true
    cgroupns_mode: private
    override_command: false
    volumes:
       - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
  - name: trixie-pkg
    image: docker.io/library/debian:trixie
    dockerfile: ../Containerfile.Debian.j2
    privileged: true
    cgroupns_mode: private
    override_command: false
    volumes:
       - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
  - name: trixie
    image: docker.io/library/debian:trixie
    dockerfile: ../Containerfile.Debian.j2
    privileged: true
    cgroupns_mode: private
    override_command: false
    volumes:
       - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
  - name: fedora43
    image: registry.fedoraproject.org/fedora:43
    dockerfile: ../Containerfile.Fedora.j2
    privileged: true
    cgroupns_mode: private
    override_command: false
    volumes:
       - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

provisioner:
  name: ansible
