---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: trixie
    image: docker.io/library/debian:trixie
    dockerfile: ../Dockerfile.debian.bookworm.j2
    privileged: true
    cgroupns_mode: private
    override_command: false
    volume_mounts:
       - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

provisioner:
  name: ansible
  playbooks:
    prepare: ../common/prepare_debian.yml
