---
- name: Install python3
  raw: 'apt update && apt install -y python3'
  args:
    executable: /bin/bash

- name: Install basic dependencies
  ansible.builtin.apt:
    name:
      - sudo
      - procps # kill command, needed for service reload (litebastion)
      - systemd
      - sqlite3  # litewitness
    state: present

- name: Install bookworm-specific dependencies
  when: ansible_facts['distribution_release'] == "bookworm"
  ansible.builtin.apt:
    name:
      - apt-utils
    state: present

- name: Install debug tooling
  ansible.builtin.apt:
    name:
      - less
      - vim
      - curl
      - iproute2
      - ldnsutils
      - iputils-ping
      - netcat-traditional
    state: present

- name: Add package source for backports
  when: ansible_facts['distribution_release'] == "bookworm"
  ansible.builtin.copy:
    content: "deb https://deb.debian.org/debian bookworm-backports main"
    dest: "/etc/apt/sources.list.d/{{ ansible_facts['distribution_release'] }}-backports.list"
    mode: '0644'
  register: add_backports

- name: Configure Glasklar package archive
  ansible.builtin.apt:
    deb: http://deb.glasklarteknik.se/glasklar-archive-keyring.deb

- name: Update apt metadata cache
  ansible.builtin.apt:
    update_cache: true
