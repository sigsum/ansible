---
- name: Verify
  hosts: all
  vars:
    test_user: alice
    test_home: "/home/{{ test_user }}"
    test_grp: svc-sigsum-agent  # must match converge.yml
  tasks:
    # TODO (mw): this is a gross hack, should be replaced with some configuration
    #            option which allows passing the path to the private key that way.
    - name: Patch configuration to append -k flag with private key
      ansible.builtin.lineinfile:
        regexp: "^RETRY="
        line: "RETRY= -k /var/lib/{{ test_grp }}/.config/sigsum-agent/key --retry"
        path: "/etc/sigsum-agent/sigsum-agent.conf"
      when: sigsum_agent_soft_key is defined

    - name: cat the patched file
      ansible.builtin.command: "cat /etc/sigsum-agent/sigsum-agent.conf"

    - name: restart sigsum-agent (to pick up the patched config)
      systemd:
        name: "sigsum-agent"
        state: restarted

    - name: stat sigsum-socket
      ansible.builtin.command: |
        sh -c "stat /usr/lib/systemd/system/sigsum-agent.socket"

    - name: "Add test user ({{ test_user }})"
      ansible.builtin.user:
        user: "{{ test_user }}"
        home: "{{ test_home }}"
        state: present

    - name: Install ssh-keygen
      ansible.builtin.apt:
        name: openssh-client
        state: present

    - name: Extract and save public key
      ansible.builtin.command: |
        sh -c "echo ssh-ed25519 $(ssh-keygen -ef /var/lib/{{ test_grp }}/.config/sigsum-agent/key | grep ^AAAA) > {{ test_home }}/key.pub"

    - name: Is it even there?
      ansible.builtin.command: |
        sh -c "stat {{ test_home }}/key.pub"

    - name: Create test message
      ansible.builtin.copy:
        content: "test message"
        dest: "{{ test_home }}/msg"
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: '0644'

    - name: Sign message and fail because of group permissions
      ansible.builtin.shell: |
        export SSH_AUTH_SOCK="/usr/lib/systemd/system/sigsum-agent.socket"
        ssh-keygen -Y sign -n testonly -f "{{ test_home }}/key.pub" "{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true
      register: sign
      failed_when: >
        (sign.rc != 0) and
        ("No private key found" not in sign.stderr)

    - name: Assert that signing failed
      ansible.builtin.assert:
        that: sign.rc != 0
        fail_msg: "Signing succeeded without {{ test_user }} being part of sigsum-agent group"

    - name: "Add {{ test_user }} to the first sigsum-agent group"
      ansible.builtin.user:
        user: "{{ test_user }}"
        groups: "{{ test_grp }}"
        append: yes

    - name: Sign message
      ansible.builtin.shell: |
        export SSH_AUTH_SOCK="/usr/lib/systemd/system/sigsum-agent.socket"
        ssh-keygen -Y sign -n testonly -f "{{ test_home }}/key.pub" "{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true
      register: sign

    - name: Verify message
      ansible.builtin.shell: ssh-keygen -Y check-novalidate -n testonly -f "{{ test_home }}/key.pub" -s "{{ test_home }}/msg.sig" <"{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true

    - name: Try to read the private key and fail
      ansible.builtin.shell: "cat /var/lib/{{ test_grp }}/.config/sigsum-agent/key"
      become_user: "{{ test_user }}"
      become: true
      register: keyread
      failed_when: >
        (keyread.rc != 0) and
        ("Permission denied" not in keyread.stderr)

    - name: Assert that private key reading failed
      ansible.builtin.assert:
        that: keyread.rc != 0
        fail_msg: "Private key leaked to {{ test_user }}: {{ keyread.stdout }}"
