---
- name: Verify
  hosts: all
  vars:
    test_user: alice
    test_home: "/home/{{ test_user }}"
    test_grp: sigsum-agent  # must match converge.yml
  tasks:
    - name: Install ssh-keygen (Debian)
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.apt:
        name: openssh-client
        state: present

    - name: Install ssh-keygen (Fedora)
      when: ansible_facts['distribution'] == "Fedora"
      ansible.builtin.dnf:
        name: openssh-clients
        state: present

    - name: "Add test user ({{ test_user }})"
      ansible.builtin.user:
        user: "{{ test_user }}"
        home: "{{ test_home }}"
        state: present

    - name: Get socket path from systemd
      ansible.builtin.command:
        cmd: systemctl show sigsum-agent.socket --property=Listen --value
      register: _socket_listen

    - name: Set socket path fact
      ansible.builtin.set_fact:
        test_socket: "{{ _socket_listen.stdout.split() | select('match', '^/') | first }}"

    - name: Extract public key
      ansible.builtin.shell: "ssh-keygen -ef /etc/sigsum-agent/key | grep ^AAAA"
      become_user: "{{ test_grp }}"
      become: true
      register: pubkey_b64

    - name: Save public key
      ansible.builtin.copy:
        content: "ssh-ed25519 {{ pubkey_b64.stdout }}\n"
        dest: "{{ test_home }}/key.pub"
        owner: "{{ test_user }}"
        mode: '0644'

    - name: Create test message
      ansible.builtin.copy:
        content: "test message"
        dest: "{{ test_home }}/msg"
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
        mode: '0644'

    - name: Sign message and fail because of group permissions
      ansible.builtin.shell: |
        export SSH_AUTH_SOCK="{{ test_socket }}"
        ssh-keygen -Y sign -n testonly -f "{{ test_home }}/key.pub" "{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true
      register: sign
      failed_when: >
        (sign.rc != 0) and
        ("No private key found" not in sign.stderr)

    - name: Assert that signing failed
      ansible.builtin.assert:
        that: sign.rc != 0
        fail_msg: "Signing succeeded without {{ test_user }} being part of sigsum-agent group"

    - name: "Add {{ test_user }} to the first sigsum-agent group"
      ansible.builtin.user:
        user: "{{ test_user }}"
        groups: "{{ test_grp }}"
        append: yes

    - name: Sign message
      ansible.builtin.shell: |
        export SSH_AUTH_SOCK="{{ test_socket }}"
        ssh-keygen -Y sign -n testonly -f "{{ test_home }}/key.pub" "{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true
      register: sign

    - name: Verify message
      ansible.builtin.shell: ssh-keygen -Y check-novalidate -n testonly -f "{{ test_home }}/key.pub" -s "{{ test_home }}/msg.sig" <"{{ test_home }}/msg"
      become_user: "{{ test_user }}"
      become: true

    - name: Try to read the private key and fail
      ansible.builtin.shell: "cat /etc/sigsum-agent/key"
      become_user: "{{ test_user }}"
      become: true
      register: keyread
      failed_when: >
        (keyread.rc != 0) and
        ("Permission denied" not in keyread.stderr)

    - name: Assert that private key reading failed
      ansible.builtin.assert:
        that: keyread.rc != 0
        fail_msg: "Private key leaked to {{ test_user }}: {{ keyread.stdout }}"
